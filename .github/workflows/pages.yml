# Publishes the game on develop as the development preview on GitHub Pages
# (Settings → Pages → Source: GitHub Actions). Only the files the game loads
# are published: index.html, css/ and js/. Docs, screenshots, tests and tools
# stay out of the site.
#
# It runs on a push to develop (a merged PR) or by hand from the Actions tab.
# It never runs for pull requests, so a PR cannot change the live preview.

name: Pages preview (develop)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the game's static files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
