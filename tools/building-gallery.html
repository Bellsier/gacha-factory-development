<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채굴 공방 · 건물 비교실</title>
<style>body{margin:0;background:#171e20;color:#f0e8d7;font:15px system-ui,sans-serif;padding:24px}h1{margin:0 0 8px}p{color:#c2c8c3;max-width:950px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}.card{background:#293334;border:1px solid #475654;border-radius:12px;padding:15px}.card h2{font-size:17px;margin:0 0 4px}.card small{color:#b8c8c2}canvas{width:100%;height:280px;object-fit:contain;image-rendering:pixelated;background:repeating-linear-gradient(0deg,#34403a 0 24px,#38463f 24px 48px);border-radius:7px;margin-top:12px}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#status{color:#d9c98a}</style></head><body>
<h1>🏡 채굴 공방 · 건물 디자인 비교실</h1>
<p>개발 전용 시각 점검 도구입니다. 게임 코드를 그대로 불러와 모든 건물을 같은 픽셀 배율로 그립니다. 저장 데이터나 건물 상태를 변경하지 않습니다. 카드마다 회색 기준선과 21px 캐릭터를 함께 표시합니다.</p><div id="status">게임 스프라이트를 불러오는 중…</div><div id="grid"></div>
<iframe id="game" src="../index.html?style=v2" title="sprite loader"></iframe>
<script>
const entries=[
['내 집','house'],['기본 공방','base'],
['제작소 1단계','workshop',1],['제작소 2단계','workshop',2],['제작소 3단계','workshop',3],
['감정소 · 폐허','appraiser',0],['감정소 · 공사','appraiser',1],['감정소 · 완공','appraiser',2],
['박물관 · 폐허','museum',0],['박물관 · 공사','museum',1],['박물관 · 완공','museum',2],['박물관 · 장식 2단계','museum',2,2]];
function paint(g,s,x,y,scale){for(const r of s.rects){g.fillStyle=r[4];g.fillRect(x+r[0]*scale,y+r[1]*scale,r[2]*scale,r[3]*scale)}}
function draw(w,entry){
const [label,kind,stage,hall]=entry, v2=true;
let s;if(kind==='house')s=w.tdHouseSpriteV2();else if(kind==='base')s=w.tdStyleFinish(w.tdBaseSprite(),'building');
else if(kind==='workshop')s=w.tdStyleFinish(w.tdWorkshopSprite(stage),'building');
else s=w.tdStyleFinish(w.tdVillageSprite(kind,stage,kind==='museum'?6:0,[],hall||0),'building');
const player=w.tdPlayerSpriteV2('down',0), scale=3;
const card=document.createElement('article');card.className='card';
const title=document.createElement('h2');title.textContent=label;card.append(title);
const meta=document.createElement('small');meta.textContent=s.w+' × '+s.h+' px · 플레이어 '+player.w+' × '+player.h+' px';card.append(meta);
const canvas=document.createElement('canvas');canvas.width=300;canvas.height=280;card.append(canvas);
const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;const baseline=248;
g.fillStyle='#a6a99d';g.fillRect(14,baseline,272,2);
const x=Math.round((300-s.w*scale)/2)+15;paint(g,s,x,baseline-s.h*scale,scale);
paint(g,player,22,baseline-player.h*scale,scale);
document.querySelector('#grid').append(card);
}
document.querySelector('#game').addEventListener('load',()=>{
try{const w=document.querySelector('#game').contentWindow;if(typeof w.tdVillageSprite!=='function'||typeof w.tdHouseSpriteV2!=='function')throw Error('필요한 스프라이트 함수가 없습니다.');
entries.forEach(e=>draw(w,e));document.querySelector('#status').textContent='비교 완료 · 모든 건물은 같은 3배 픽셀 배율로 표시됩니다.';}
catch(e){document.querySelector('#status').textContent='비교 화면 생성 실패: '+e.message;}
});
</script></body></html>
