<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 캐릭터 시안 비교</title>
<style>
  :root{ --bg:#20261f; --panel:#2b3329; --text:#eef0e6; --dim:#b8c0b0; --line:#465242; --grass:#5d8a4c; }
  body{ margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  h1{ font-size:20px; margin:0 0 4px; } h2{ font-size:16px; margin:22px 0 8px; } p{ color:var(--dim); margin:4px 0; }
  .sheet{ display:grid; grid-template-columns:120px repeat(4, auto); gap:6px 10px; align-items:center; background:var(--panel); padding:12px; border:1px solid var(--line); border-radius:8px; width:max-content; }
  .lab{ color:var(--dim); font-size:13px; } .head{ color:var(--dim); font-size:12px; text-align:center; }
  canvas{ image-rendering:pixelated; display:block; background:var(--grass); }
  .anim{ display:flex; gap:18px; flex-wrap:wrap; background:var(--panel); padding:12px; border:1px solid var(--line); border-radius:8px; width:max-content; }
  .cell{ text-align:center; color:var(--dim); font-size:12px; }
  table{ border-collapse:collapse; background:var(--panel); } td, th{ border:1px solid var(--line); padding:4px 8px; text-align:right; } th:first-child, td:first-child{ text-align:left; }
</style></head><body>
<h1>G1 캐릭터 시안 — 현재 그림과 나란히</h1>
<p>게임의 스프라이트 함수(develop 26cee0b의 <code>tdPlayerSprite</code>, <code>tdPlayerSpriteV2</code>)와 시안(<code>proposal.js</code>)을 같은 배율로 그립니다. 16×22, 발 기준선(아래 가운데), 코발트 머리는 그대로입니다. 게임 코드는 바뀌지 않았습니다.</p>
<div id="sheets"></div>
<h2>걷기 애니메이션 (게임과 같은 속도: 3칸/초, 0.22칸마다 다음 프레임 ≈ 73ms)</h2>
<div class="anim" id="anim"></div>
<h2>수치</h2>
<div id="metrics"></div>
<script src="../../../../js/topdown/sprites.js"></script>
<script src="../../../../js/topdown/style.js"></script>
<script src="proposal.js"></script>
<script>
const SCALE = +(new URLSearchParams(location.search).get('scale') || 8);
const DIRS = [['down', '정면(아래)'], ['up', '후면(위)'], ['right', '오른쪽'], ['left', '왼쪽']];
const ROWS = [['현재 classic', (d, f) => tdPlayerSprite(d, f)], ['시안 classic', (d, f) => tdPlayerSpriteG1(d, f)], ['현재 v2', (d, f) => tdPlayerSpriteV2(d, f)], ['시안 v2', (d, f) => tdPlayerSpriteG1V2(d, f)]];
function draw(sp, scale){ const c = document.createElement('canvas'); c.width = sp.w * scale; c.height = sp.h * scale; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; const s = tdSpriteImage(sp); g.drawImage(s, 0, 0, c.width, c.height); return c; }
const sheets = document.getElementById('sheets');
DIRS.forEach(([d, name]) => {
  const h = document.createElement('h2'); h.textContent = name + ' — 프레임 0(대기) · 1 · 2 · 3'; sheets.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'sheet'; grid.dataset.dir = d;
  grid.appendChild(Object.assign(document.createElement('div'), { className: 'head' }));
  [0, 1, 2, 3].forEach((f) => grid.appendChild(Object.assign(document.createElement('div'), { className: 'head', textContent: '프레임 ' + f })));
  ROWS.forEach(([label, fn]) => { grid.appendChild(Object.assign(document.createElement('div'), { className: 'lab', textContent: label })); [0, 1, 2, 3].forEach((f) => grid.appendChild(draw(fn(d, f), SCALE))); });
  sheets.appendChild(grid);
});
// animation
const anim = document.getElementById('anim'), live = [];
ROWS.forEach(([label, fn]) => DIRS.forEach(([d, name]) => { const box = document.createElement('div'); box.className = 'cell'; const c = document.createElement('canvas'); c.width = 16 * 5; c.height = 22 * 5; box.appendChild(c); box.appendChild(document.createTextNode(label + ' · ' + name)); anim.appendChild(box); live.push({ c, frames: [0, 1, 2, 3].map((f) => tdSpriteImage(fn(d, f))) }); }));
let t0 = performance.now();
(function tick(now){ const f = Math.floor((now - t0) / 73) % 4; live.forEach(({ c, frames }) => { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, c.width, c.height); g.drawImage(frames[f], 0, 0, c.width, c.height); }); requestAnimationFrame(tick); })(t0);
// metrics
function raster(sp){ return tdRaster(sp); }
const opaque = (p) => p && p[3] >= 1;
function bounds(sp){ const r = raster(sp); let top = 99, bottom = -1; for(let y = 0; y < r.h; y++) for(let x = 0; x < r.w; x++) if(opaque(r.px[y * r.w + x])){ top = Math.min(top, y); bottom = Math.max(bottom, y); } return { top, bottom }; }
function diff(a, b, y0){ const ra = raster(a), rb = raster(b); let n = 0; for(let k = (y0 || 0) * ra.w; k < ra.px.length; k++){ const p = ra.px[k], q = rb.px[k]; if(!!p !== !!q || (p && q && tdColorKey(p) !== tdColorKey(q))) n++; } return n; }
// legs: in the leg rows (16-17), the number of separate opaque runs (2 = two legs read apart)
function legRuns(sp, rows){ const r = raster(sp); return rows.map((y) => { let runs = 0, inRun = false; for(let x = 0; x < r.w; x++){ const o = opaque(r.px[y * r.w + x]); if(o && !inRun) runs++; inRun = o; } return runs; }); }
// how far the two legs are apart in contrast: the luminance step between the far and the near leg in the side view
const M = {};
ROWS.forEach(([label, fn]) => { M[label] = {};
  DIRS.forEach(([d]) => { const fr = [0, 1, 2, 3].map((f) => fn(d, f)); const bb = fr.map(bounds);
    M[label][d] = { size: fr[0].w + 'x' + fr[0].h, top: Math.min(...bb.map((x) => x.top)), bottom: Math.max(...bb.map((x) => x.bottom)), frameDiff: [diff(fr[0], fr[1]), diff(fr[1], fr[2]), diff(fr[2], fr[3]), diff(fr[3], fr[0])], legDiff13: diff(fr[1], fr[3], 16), legDiff01: diff(fr[0], fr[1], 16), legRunsIdle: legRuns(fr[0], [17, 18, 19]).join('/') }; }); });
window.__metrics = M;
let html = '<table><tr><th>그림</th><th>방향</th><th>크기</th><th>머리 끝 행</th><th>발 끝 행</th><th>프레임 사이 다른 픽셀 수 (0→1, 1→2, 2→3, 3→0)</th><th>다리 부분(16~21행) 다른 픽셀 수: 대기↔걸음1, 걸음1↔걸음3</th><th>대기 프레임 다리 행(17/18/19)의 덩어리 수</th></tr>';
Object.entries(M).forEach(([label, byDir]) => Object.entries(byDir).forEach(([d, m]) => { html += `<tr><td>${label}</td><td>${d}</td><td>${m.size}</td><td>${m.top}</td><td>${m.bottom}</td><td>${m.frameDiff.join(', ')} (합 ${m.frameDiff.reduce((a, b) => a + b, 0)})</td><td>${m.legDiff01}, ${m.legDiff13}</td><td>${m.legRunsIdle}</td></tr>`; }));
document.getElementById('metrics').innerHTML = html + '</table>';
</script>
</body></html>
