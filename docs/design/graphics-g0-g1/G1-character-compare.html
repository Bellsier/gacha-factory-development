<h1>G1 캐릭터 시안 — 현재 그림과 나란히</h1>
<p>게임의 스프라이트 함수(develop 26cee0b의 <code>tdPlayerSprite</code>, <code>tdPlayerSpriteV2</code>)와 시안(<code>proposal.js</code>)을 같은 배율로 그립니다. 16×22, 발 기준선(아래 가운데), 코발트 머리는 그대로입니다. 게임 코드는 바뀌지 않았습니다.</p>
<div id="sheets"></div>
<h2>걷기 애니메이션 (게임과 같은 속도: 3칸/초, 0.22칸마다 다음 프레임 ≈ 73ms)</h2>

<script>
// ---------------------------------------------------------------------------
// Task 105: the game's own pixel art. Every sprite is a list of pixel
// rectangles [x, y, w, h, colour] painted by the functions below (no image
// files, no borrowed art), so it is testable without a canvas and travels in
// the single-HTML build. tdSpriteImage() bakes a sprite into a small canvas
// once; the renderer scales it by an integer zoom with smoothing off.
// ---------------------------------------------------------------------------
const TD_RES_COLORS = {
  iron: ['#b8704f', '#e09a72'], coal: ['#2c3034', '#4d545a'], mana: ['#8a5cd6', '#c4a2ff'], crystal: ['#4fc4dc', '#bff3ff'],
  rareMetal: ['#b9c3cc', '#f1f5f8'], relic: ['#c9a24a', '#f2d68c'], cosmicShard: ['#e06fa8', '#ffc0df'], plasma: ['#ff4fcf', '#ffd0f4'],
};

// Collects rectangles; mirrored horizontally when asked.
function tdPainter(w, h){
  const rects = [];
  const P = (x, y, rw, rh, c) => { if(rw > 0 && rh > 0) rects.push([x, y, rw, rh, c]); };
  P.disc = (cx, cy, r, c) => { for(let y = -r; y <= r; y++){ const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); P(cx - hw, cy + y, hw * 2 + 1, 1, c); } };
  P.done = (mirror) => ({ w, h, rects: mirror ? rects.map(([x, y, rw, rh, c]) => [w - x - rw, y, rw, rh, c]) : rects });
  return P;
}

// --- the player: the blue-haired northern miner (the approved character sheet,
// 2026-10-18). Cobalt hair, a soft gender-neutral face, a brown winter parka
// with a cream fur collar and hem, teal pattern trim, a small backpack with a
// bedroll, grey trousers and ochre fur-cuffed boots; a little lantern hangs at
// the hip (the light the game's headlamp glow comes from). 16 x 22 like the
// sprite it replaces, feet at the bottom centre, so the size against the tiles
// and every collision and light offset stay the same. Left is the mirror of right.
const TD_PLAYER_COLORS = {
  hair: '#3d5c9e', hairDark: '#2a4176', hairLight: '#6487cc',
  skin: '#f3d2b4', skinShade: '#dfb293', eye: '#4a3326', eyeLight: '#8a5c40', blush: '#eaa598', mouth: '#d99a86',
  parka: '#a8774a', parkaDark: '#7c5333', parkaLight: '#c4935e', fur: '#f2e4ca', furShade: '#d6c1a0',
  trim: '#4d8ca3', leather: '#6b4128', buckle: '#d8a84a', glove: '#5a3a26',
  pants: '#6c7076', pantsDark: '#55595e', boot: '#bf8a4c', bootDark: '#8c5f30',
  pack: '#8a5a36', packDark: '#6b4128', roll: '#8d9096', rollDark: '#6f7277',
  lamp: '#fff3b0', lampFrame: '#4a3626',
};
function tdPlayerSprite(dir, frame){
  const C = TD_PLAYER_COLORS;
  const P = tdPainter(16, 22);
  const b = (frame === 1 || frame === 3) ? 1 : 0;       // the body sinks a pixel on each step
  const s = frame === 1 ? 1 : frame === 3 ? -1 : 0;     // which leg swings forward
  const side = dir === 'left' || dir === 'right';
  P(3, 20, 10, 2, 'rgba(0,0,0,0.25)'); // shadow
  // a boot with its fur cuff: x, top row, and how many rows of leg show above it
  const boot = (x, y, w) => { P(x, y, w, 1, C.furShade); P(x, y + 1, w, 2, C.boot); P(x, y + 2, w, 1, C.bootDark); };
  if(side){
    // legs scissor: the near leg forward on one step, back on the other (drawn facing right)
    // the back foot lifts a pixel as it swings; both stand on the same ground line as the front view
    const back = s === 0 ? 0 : 1;
    P(6 - s, 16, 2, 2 - back, C.pantsDark); boot(5 - s, 18 - back, 3);
    P(8 + s, 16, 2, 2, C.pants); boot(8 + s, 18, 3);
  } else {
    // front and back: the stepping foot lifts a pixel
    const l = Math.max(0, s), r = Math.max(0, -s);
    P(5, 16, 2, 1, C.pants); boot(4, 18 - l, 3);
    P(9, 16, 2, 1, C.pants); boot(9, 18 - r, 3);
    P(5, 17 - l, 2, 1, C.pantsDark); P(9, 17 - r, 2, 1, C.pantsDark);
  }
  if(dir === 'down'){
    // parka body with a diagonal strap, a belt and the teal pattern above the fur hem
    P(4, 10 + b, 8, 5, C.parka); P(4, 10 + b, 1, 5, C.parkaDark); P(11, 10 + b, 1, 5, C.parkaDark);
    for(let k = 0; k < 3; k++) P(5 + k, 11 + b + k, 1, 1, C.leather);
    P(4, 13 + b, 8, 1, C.leather); P(7, 13 + b, 2, 1, C.buckle);
    P(5, 14 + b, 1, 1, C.trim); P(7, 14 + b, 2, 1, C.trim); P(10, 14 + b, 1, 1, C.trim);
    P(3, 15 + b, 10, 1, C.fur); P(4, 15 + b, 1, 1, C.furShade); P(8, 15 + b, 1, 1, C.furShade); P(11, 15 + b, 1, 1, C.furShade);
    // sleeves swing opposite to the legs; gloves; the lantern in the right hand (viewer's left)
    const la = Math.max(0, -s), ra = Math.max(0, s);
    P(2, 10 + b + la, 2, 4, C.parkaLight); P(2, 10 + b + la, 1, 4, C.parkaDark); P(2, 14 + b + la, 2, 1, C.glove);
    P(12, 10 + b + ra, 2, 4, C.parkaLight); P(13, 10 + b + ra, 1, 4, C.parkaDark); P(12, 14 + b + ra, 2, 1, C.glove);
    P(2, 15 + b + la, 2, 1, C.lampFrame); P(2, 16 + b + la, 2, 2, C.lamp); P(2, 18 + b + la, 2, 1, C.lampFrame);
    // the big fur collar round the chin
    P(3, 9 + b, 10, 2, C.fur); P(2, 10 + b, 1, 1, C.fur); P(13, 10 + b, 1, 1, C.fur); P(4, 10 + b, 8, 1, C.furShade);
    // face: soft round cheeks, brown eyes with a light, a little blush
    P(4, 4 + b, 8, 5, C.skin); P(5, 8 + b, 6, 1, C.skinShade);
    P(5, 6 + b, 1, 2, C.eye); P(10, 6 + b, 1, 2, C.eye); P(5, 6 + b, 1, 1, C.eyeLight); P(10, 6 + b, 1, 1, C.eyeLight);
    P(4, 8 + b, 1, 1, C.blush); P(11, 8 + b, 1, 1, C.blush); P(7, 8 + b, 2, 1, C.mouth);
    // cobalt hair: a messy crown, spiky bangs and side locks to the collar
    P(4, 1 + b, 8, 1, C.hair); P(3, 2 + b, 10, 2, C.hair); P(5, 0 + b, 1, 1, C.hair); P(8, 0 + b, 2, 1, C.hair); P(11, 1 + b, 1, 1, C.hairDark);
    P(4, 4 + b, 8, 1, C.hair); P(4, 5 + b, 1, 1, C.hair); P(6, 5 + b, 2, 1, C.hair); P(9, 5 + b, 1, 1, C.hair); P(11, 5 + b, 1, 1, C.hair);
    P(3, 4 + b, 1, 5, C.hair); P(12, 4 + b, 1, 5, C.hair); P(3, 7 + b, 1, 2, C.hairDark); P(12, 7 + b, 1, 2, C.hairDark);
    P(5, 2 + b, 3, 1, C.hairLight); P(9, 1 + b, 1, 1, C.hairLight); P(4, 3 + b, 1, 1, C.hairDark); P(10, 3 + b, 2, 1, C.hairDark);
  } else if(dir === 'up'){
    // from behind: the backpack with its bedroll fills the back of the parka
    P(4, 10 + b, 8, 5, C.parka); P(3, 15 + b, 10, 1, C.fur); P(5, 15 + b, 1, 1, C.furShade); P(10, 15 + b, 1, 1, C.furShade);
    const la = Math.max(0, s), ra = Math.max(0, -s);
    P(2, 10 + b + la, 2, 4, C.parkaLight); P(2, 10 + b + la, 1, 4, C.parkaDark); P(2, 14 + b + la, 2, 1, C.glove);
    P(12, 10 + b + ra, 2, 4, C.parkaLight); P(13, 10 + b + ra, 1, 4, C.parkaDark); P(12, 14 + b + ra, 2, 1, C.glove);
    P(4, 11 + b, 8, 5, C.pack); P(4, 15 + b, 8, 1, C.packDark); P(5, 12 + b, 2, 2, C.packDark); P(9, 12 + b, 2, 2, C.packDark); P(7, 11 + b, 2, 4, C.leather);
    P(3, 9 + b, 10, 2, C.fur); P(4, 10 + b, 8, 1, C.furShade);
    P(4, 10 + b, 8, 2, C.roll); P(4, 11 + b, 8, 1, C.rollDark); P(6, 10 + b, 1, 2, C.leather); P(9, 10 + b, 1, 2, C.leather);
    // the back of the head: all hair, a few spikes and a darker nape
    P(4, 1 + b, 8, 1, C.hair); P(3, 2 + b, 10, 7, C.hair); P(5, 0 + b, 1, 1, C.hair); P(8, 0 + b, 2, 1, C.hair);
    P(4, 8 + b, 8, 1, C.hairDark); P(3, 6 + b, 1, 3, C.hairDark); P(12, 6 + b, 1, 3, C.hairDark);
    P(5, 2 + b, 3, 1, C.hairLight); P(9, 3 + b, 2, 1, C.hairLight); P(6, 5 + b, 1, 2, C.hairDark); P(9, 6 + b, 1, 2, C.hairDark);
  } else {
    // facing right: the backpack and bedroll behind, the parka, one arm swinging with the lantern
    P(2, 10 + b, 4, 6, C.pack); P(2, 10 + b, 1, 6, C.packDark); P(2, 15 + b, 4, 1, C.packDark); P(3, 12 + b, 2, 2, C.packDark);
    P(2, 8 + b, 4, 2, C.roll); P(2, 9 + b, 4, 1, C.rollDark);
    P(5, 10 + b, 7, 5, C.parka); P(11, 10 + b, 1, 5, C.parkaDark); P(5, 13 + b, 7, 1, C.leather); P(10, 13 + b, 1, 1, C.buckle);
    P(7, 14 + b, 1, 1, C.trim); P(9, 14 + b, 1, 1, C.trim);
    P(4, 15 + b, 9, 1, C.fur); P(6, 15 + b, 1, 1, C.furShade); P(10, 15 + b, 1, 1, C.furShade);
    P(5, 10 + b, 1, 4, C.leather); // the pack strap over the shoulder
    // the lantern hangs from the belt at the front of the hip, above the legs
    P(11, 12 + b, 2, 1, C.lampFrame); P(11, 13 + b, 2, 2, C.lamp); P(11, 15 + b, 2, 1, C.lampFrame);
    // the near arm swings forward and back
    const ax = 8 + s;
    P(ax, 10 + b, 2, 4, C.parkaLight); P(ax, 13 + b, 2, 1, C.parkaDark); P(ax, 14 + b, 2, 1, C.glove);
    // the fur collar
    P(4, 9 + b, 8, 2, C.fur); P(5, 10 + b, 6, 1, C.furShade);
    // face in profile: cheek, one eye, a hint of nose
    P(7, 4 + b, 5, 5, C.skin); P(8, 8 + b, 4, 1, C.skinShade); P(12, 6 + b, 1, 2, C.skin);
    P(10, 6 + b, 1, 2, C.eye); P(10, 6 + b, 1, 1, C.eyeLight); P(10, 8 + b, 1, 1, C.blush);
    // hair: crown, bangs over the brow, the back of the head and a lock by the ear
    P(4, 1 + b, 8, 1, C.hair); P(3, 2 + b, 10, 2, C.hair); P(6, 0 + b, 1, 1, C.hair); P(9, 0 + b, 2, 1, C.hair);
    P(3, 4 + b, 5, 5, C.hair); P(8, 4 + b, 5, 1, C.hair); P(9, 5 + b, 1, 1, C.hair); P(11, 5 + b, 2, 1, C.hair);
    P(3, 7 + b, 2, 2, C.hairDark); P(7, 5 + b, 1, 3, C.hairDark); P(12, 2 + b, 1, 2, C.hairDark);
    P(5, 2 + b, 3, 1, C.hairLight); P(4, 4 + b, 2, 1, C.hairLight);
  }
  return P.done(dir === 'left');
}

// --- a vein in the ground: a boulder with ore. 24 x 20, base at the bottom centre.
function tdOreSprite(resource, kind){
  const P = tdPainter(24, 20);
  const undiscovered = kind === 'undiscovered';
  const rock = undiscovered ? ['#6a6660', '#55514c', '#827d76'] : ['#7b766f', '#5e5a55', '#9a948c'];
  P(3, 17, 18, 3, 'rgba(0,0,0,0.25)');
  P.disc(12, 11, 8, rock[0]);
  P(5, 14, 14, 4, rock[1]); P(7, 17, 10, 1, rock[1]);
  P(7, 5, 6, 2, rock[2]); P(6, 7, 3, 2, rock[2]);
  if(undiscovered){
    P(14, 8, 4, 2, '#5f7d4e'); P(15, 7, 2, 1, '#6f8f5c'); // moss
    P(9, 10, 3, 1, rock[1]); P(13, 13, 3, 1, rock[1]);
  } else {
    const [c, hi] = TD_RES_COLORS[resource] || ['#aaa', '#fff'];
    [[8, 9], [13, 7], [15, 11], [10, 13], [6, 11]].forEach(([x, y], k) => { P(x, y, 2, 2, c); if(k % 2 === 0) P(x, y, 1, 1, hi); });
    P(12, 10, 3, 2, c); P(12, 10, 1, 1, hi);
  }
  if(kind === 'secured'){
    P(19, 6, 1, 12, '#8a6440'); P(20, 6, 4, 3, '#3fc9b0'); P(20, 9, 2, 1, '#2f9c88'); // a staked flag
  }
  return P.done(false);
}

// --- building parts shared by the cabin, the craft huts and the village facilities.
// Doors are sized to the player (21 px, hair to boots): the cabin's about 1x, the
// huts' and facilities' about 0.75x, the house's 1.2x (Task 119). Warm glass and
// forge colours are the ones the v2 finish keeps bright (style.js TD_FINISH_GLOW).
const TD_BUILDING = {
  doorFrame: '#4a3626', door: '#6a4a30', doorDark: '#553a26', doorLight: '#7f5a3a', strap: '#4b4440', handle: '#e2b23c',
  step: '#b4aaa0', stepTop: '#cfc6bc', glass: '#f3d27a', glassTop: '#f7e2a0', forge: '#f0a050', forgeHot: '#ffe08a',
};
// A sloped roof of shingle courses: `rows` rows from `y`, the ridge `w` wide at `x0`,
// widening by `spread` px a side to the eaves. Each course: a lit top row, a mid row
// with staggered tab joints, a dark lower edge.
function tdRoof(P, x0, y, w, rows, spread, light, mid, dark){
  for(let k = 0; k < rows; k++){
    const o = Math.floor(k * spread / Math.max(1, rows - 1)), x = x0 - o, rw = w + 2 * o, c = k % 3;
    P(x, y + k, rw, 1, c === 0 ? light : c === 1 ? mid : dark);
    if(c === 1) for(let tx = x + 2 + (Math.floor(k / 3) % 2) * 3; tx < x + rw - 1; tx += 6) P(tx, y + k, 1, 1, dark);
  }
}
// Horizontal boards: seams every 3 rows, staggered board ends.
function tdPlanks(P, x, y, w, h, base, seam){
  P(x, y, w, h, base);
  for(let r = 0; r * 3 < h; r++){
    if(r * 3 + 2 < h) P(x, y + r * 3 + 2, w, 1, seam);
    for(let bx = x + 4 + (r % 2) * 7; bx < x + w - 1; bx += 14) P(bx, y + r * 3, 1, Math.min(2, h - r * 3), seam);
  }
}
// Stone courses: mortar behind, blocks two rows high in a running bond, lit along their top.
function tdStones(P, x, y, w, h, mortar, stone, light){
  P(x, y, w, h, mortar);
  for(let r = 0; r * 3 < h; r++){
    const rows = Math.min(2, h - r * 3);
    for(let bx = x - (r % 2) * 3; bx < x + w; bx += 6){
      const x0 = Math.max(x, bx), x1 = Math.min(x + w, bx + 5);
      P(x0, y + r * 3, x1 - x0, rows, stone); P(x0, y + r * 3, x1 - x0, 1, light);
    }
  }
}
// A plank door in its frame; `arch` rounds the top corners. (x, y) the frame's top left.
function tdDoor(P, x, y, w, h, arch){
  const B = TD_BUILDING;
  for(let r = 0; r < h; r++){ const inset = arch ? (r === 0 ? 2 : r === 1 ? 1 : 0) : 0; P(x + inset, y + r, w - 2 * inset, 1, B.doorFrame); }
  for(let r = 1; r < h; r++){ const inset = arch ? (r === 1 ? 2 : r === 2 ? 1 : 0) : 0; P(x + 1 + inset, y + r, w - 2 - 2 * inset, 1, B.door); }
  P(x + 1, y + 2, 1, h - 2, B.doorLight);
  for(let px = x + 3; px < x + w - 2; px += 3) P(px, y + 2, 1, h - 2, B.doorDark);
}
// A window: frame, warm glass lit at the top, an optional mullion cross and a sill.
function tdWindow(P, x, y, w, h, cross, sill){
  const B = TD_BUILDING;
  P(x, y, w, h, '#5a3b28'); P(x + 1, y + 1, w - 2, h - 2, B.glass); P(x + 1, y + 1, w - 2, 1, B.glassTop);
  if(cross){ P(x + Math.floor(w / 2), y + 1, 1, h - 2, '#5a3b28'); P(x + 1, y + Math.floor(h / 2), w - 2, 1, '#5a3b28'); }
  if(sill) P(x - 1, y + h, w + 2, 1, sill);
}

// --- the workshop (공방): the miners' cabin, 64 x 58; the door is at the bottom centre
// (ground row 54). Red shingle roof with the pickaxe-and-gem sign in its gable, plank
// walls on a stone footing, a door the player's height, an ore crate and a pickaxe.
// The windows stay where their lights are (render: base x -0.24 / +0.26, y -0.3).
function tdBaseSprite(){
  const P = tdPainter(64, 58), B = TD_BUILDING;
  P(4, 54, 56, 4, 'rgba(0,0,0,0.22)');
  // walls: boards over a stone footing, corner posts and the beam under the eaves
  tdPlanks(P, 6, 27, 52, 23, '#b08a5a', '#97734a');
  tdStones(P, 6, 50, 52, 4, '#6c645b', '#9a9086', '#b4aaa0');
  P(6, 27, 2, 23, '#8a6440'); P(6, 27, 1, 23, '#a07a50'); P(56, 27, 2, 23, '#8a6440'); P(57, 27, 1, 23, '#6f5034');
  P(6, 27, 52, 2, '#8a6440'); P(6, 29, 52, 1, '#6f5034');
  // roof, the eaves' edge and the shade under it
  tdRoof(P, 11, 5, 42, 21, 8, '#b05a46', '#9a4a3a', '#7a3a2e');
  P(2, 25, 60, 2, '#6a3026'); P(8, 30, 48, 1, 'rgba(60,30,20,0.18)');
  // the gable sign: a pickaxe and a gem
  P(24, 12, 16, 8, '#5a3b28'); P(25, 13, 14, 6, '#c9a26a'); P(25, 13, 14, 1, '#e0bf86');
  P(27, 14, 6, 1, '#5d5d63'); P(27, 15, 1, 1, '#5d5d63'); P(32, 15, 1, 1, '#5d5d63'); P(30, 15, 1, 3, '#7a5236');
  P(35, 15, 2, 2, '#4fc4dc'); P(35, 15, 1, 1, '#bff3ff');
  // chimney: bricks, a lit side and a cap
  P(44, 1, 7, 11, '#7a6a5e'); P(44, 1, 2, 11, '#958576'); for(let y = 3; y < 12; y += 3) P(44, y, 7, 1, '#5f544b');
  P(43, 0, 9, 2, '#a59585');
  // windows with their sills
  tdWindow(P, 11, 32, 11, 11, true, '#a07a50'); tdWindow(P, 43, 32, 11, 11, true, '#a07a50');
  // the door, its iron straps and handle, the step
  tdDoor(P, 25, 32, 14, 20, false);
  P(26, 37, 12, 1, B.strap); P(26, 46, 12, 1, B.strap); P(35, 41, 2, 2, B.handle);
  P(23, 52, 18, 2, B.step); P(23, 52, 18, 1, B.stepTop);
  // a pickaxe leaning by the door and a crate of ore by the wall
  P(19, 40, 6, 1, '#77777e'); P(19, 41, 1, 1, '#5d5d63'); P(24, 41, 1, 1, '#5d5d63'); P(22, 41, 1, 12, '#8a6440');
  P(49, 46, 8, 8, '#9a7446'); P(49, 46, 8, 1, '#b8915c'); P(49, 50, 8, 1, '#7a5a36'); P(52, 46, 1, 8, '#7a5a36');
  P(50, 45, 2, 1, '#b8704f'); P(53, 44, 2, 2, '#2c3034'); P(55, 45, 1, 1, '#e09a72');
  return P.done(false);
}

// --- a craft workshop (제작소) by tier 1-3 (Task 79 look tiers), 44 x 40, ground row 37.
// The same walls and door (so the same collision box), growing with the tier:
//   1 a plank smithy: brown shingles, a stone stack, one forge window, an anvil on a stump, logs
//   2 half stone walls, moss-green roof, a taller brick chimney, a second window, a lantern,
//     iron straps on the door, a crate of ingots
//   3 stone masonry, a slate-plum roof with a gold ridge and emblem, a forge fire in the

// Bakes sprite rects into a canvas (null without a 2D canvas, e.g. in jsdom).
function tdSpriteImage(sprite){
  if(typeof document === 'undefined') return null;
  const c = document.createElement('canvas');
  c.width = sprite.w; c.height = sprite.h;
  const g = c.getContext && c.getContext('2d');
  if(!g) return null;
  sprite.rects.forEach(([x, y, w, h, col]) => { g.fillStyle = col; g.fillRect(x, y, w, h); });
  return c;
}

// All sprites the renderer needs, baked once.
function tdBuildSpriteSheet(){
  const sheet = { player: {}, ore: {}, workshop: {}, prop: {} };
  const v2 = typeof tdStyleV2 === 'function' && tdStyleV2(); // the style experiment (?style=v2)
  const R = typeof tdResFactor === 'function' ? tdResFactor() : 1; // the resolution experiment (?res=1.5 / 2, with v2)
  const atRes = (img) => { if(img) img.artRes = R; return img; };
  ['down', 'up', 'left', 'right'].forEach(d => { sheet.player[d] = [0, 1, 2, 3].map(f => R > 1 ? atRes(tdSpriteImage(R === 1.5 ? tdPlayerSprite15(d, f) : tdPlayerSpriteRes(d, f, R))) : tdSpriteImage(v2 ? tdPlayerSpriteV2(d, f) : tdPlayerSprite(d, f))); });
  // graphics pass 2: in v2 everything below gets the same finish as the player and the house (same sizes)
  const fin = typeof tdStyleFinish === 'function' ? tdStyleFinish : (sp) => sp;
  Object.keys(TD_RES_COLORS).forEach(r => { sheet.ore[r] = { unsecured: tdSpriteImage(fin(tdOreSprite(r, 'unsecured'), 'vein')), secured: tdSpriteImage(fin(tdOreSprite(r, 'secured'), 'vein')) }; });
  sheet.ore.undiscovered = tdSpriteImage(fin(tdOreSprite(null, 'undiscovered'), 'vein'));
  sheet.base = tdSpriteImage(fin(tdBaseSprite(), 'building'));
  sheet.house = R > 1 ? atRes(tdSpriteImage(tdHouseSpriteRes(R))) : tdSpriteImage(v2 ? tdHouseSpriteV2() : tdHouseSprite()); // Task 119
  sheet.torch = [0, 1, 2].map(f => tdSpriteImage(fin(tdTorchSprite(f), 'thin')));
  [1, 2, 3].forEach(t => { sheet.workshop[t] = tdSpriteImage(fin(tdWorkshopSprite(t), 'building')); });
  ['bigTree', 'sparseTree', 'grass', 'rock', 'clearing', 'exposedVein', 'undevelopedVein', 'rareVein', 'crystal', 'oldShaftEntrance', 'timberSupport', 'mineCart', 'diggingMarks', 'lamp', 'villageBoard']
    .forEach(k => { sheet.prop[k] = tdSpriteImage(fin(tdPropSprite(k), typeof tdFinishPropKind === 'function' ? tdFinishPropKind(k) : null)); });
  return sheet;
}

<script>
// ---------------------------------------------------------------------------
// Style experiment v2 (opt-in: ?style=v2). A crisper, textured pixel style for
// the player, the house, the grass and the cobbled roads only — everything else
// keeps the classic look. Same sprite sizes, anchors and ground lines as the
// classic sprites, so collision, lights and every system stay as they are.
//   - render scale snapped so one art pixel is a whole number of device pixels
//   - rounded silhouette corners and a selective inner outline (a dark warm
//     tone mixed into the edge pixels, never black)
//   - light from the top left: warm highlights, cooler shade bottom right
//   - shadows are stepped pixel shapes with flat alpha, no blur
// Nothing here is saved. Without the parameter nothing changes.
// ---------------------------------------------------------------------------
function tdStyleName(){
  if(TD_STYLE_CACHE.name) return TD_STYLE_CACHE.name;
  let s = 'classic';
  try { s = new URLSearchParams(window.location.search).get('style') === 'v2' ? 'v2' : 'classic'; } catch(e){ s = 'classic'; }
  TD_STYLE_CACHE.name = s;
  return s;
}
const TD_STYLE_CACHE = { name: null };
function tdStyleV2(){ return tdStyleName() === 'v2'; }

// Device pixels per CSS pixel for drawing: in v2, chosen so zoom x scale is a whole number
// (at a 1.25 / 1.5 / 2.625 device ratio the classic scale gives art pixels of uneven width).
function tdStyleRenderScale(zoom, dpr){
  if(!tdStyleV2()) return dpr;
  return Math.max(1, Math.round(zoom * dpr)) / zoom;
}

// --- pixels -----------------------------------------------------------------
const TD_OUTLINE_RGB = [42, 30, 40];   // the outline tone: a deep warm plum
const TD_LIGHT_RGB = [255, 238, 205];  // warm light from the top left
const TD_SHADE_RGB = [46, 44, 72];     // shade bottom right leans a little cool

function tdParseColor(c){
  if(c[0] === '#' && c.length === 4) return [parseInt(c[1] + c[1], 16), parseInt(c[2] + c[2], 16), parseInt(c[3] + c[3], 16), 1]; // '#888'
  if(c[0] === '#') return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16), 1];
  const m = c.match(/rgba?\(([^)]+)\)/), v = m ? m[1].split(',').map(Number) : [0, 0, 0, 1];
  return [v[0], v[1], v[2], v.length > 3 ? v[3] : 1];
}
function tdMix(a, b, t){ return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), a[3]]; }
function tdColorKey(p){ return p[3] >= 1 ? '#' + p.slice(0, 3).map(v => v.toString(16).padStart(2, '0')).join('') : 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + p[3] + ')'; }

// A painter sprite as a pixel grid ([r, g, b, a] or null); see-through rects blend over what is under them.
function tdRaster(sp){
  const px = new Array(sp.w * sp.h).fill(null);
  sp.rects.forEach(([x, y, w, h, c]) => {
    const col = tdParseColor(c);
    for(let yy = Math.max(0, y); yy < Math.min(sp.h, y + h); yy++) for(let xx = Math.max(0, x); xx < Math.min(sp.w, x + w); xx++){
      const k = yy * sp.w + xx, under = px[k];
      px[k] = col[3] >= 1 || !under ? col.slice() : [...tdMix(under, col, col[3]).slice(0, 3), Math.min(1, under[3] + col[3] * (1 - under[3]))];
    }
  });
  return { w: sp.w, h: sp.h, px };
}
// Back to a painter sprite (runs of one colour per row become one rect).
function tdUnraster(r){
  const rects = [];
  for(let y = 0; y < r.h; y++){
    let x = 0;
    while(x < r.w){
      const p = r.px[y * r.w + x];
      if(!p){ x++; continue; }
      const key = tdColorKey(p); let e = x + 1;
      while(e < r.w && r.px[y * r.w + e] && tdColorKey(r.px[y * r.w + e]) === key) e++;
      rects.push([x, y, e - x, 1, key]); x = e;
    }
  }
  return { w: r.w, h: r.h, rects };
}

// The shared finishing pass: rounded convex corners, a selective inner outline,
// and light/shade by distance to the silhouette's top-left / bottom-right edge.
//   keep(p): pixels left as they are (eyes, glass glow, a flame)
//   roundRows: [y0, y1] — rows whose convex corners are cut (the round parts)
function tdStylize(r, opts){
  const o = opts || {}, W = r.w, H = r.h, px = r.px;
  const solid = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !!px[y * W + x] && px[y * W + x][3] >= 1;
  const keep = o.keep || (() => false);
  // 1. round: a corner pixel open on two touching sides goes (top corners), or darkens (lower ones)
  const [r0, r1] = o.roundRows || [0, -1];
  const cut = [];
  for(let y = r0; y <= r1; y++) for(let x = 0; x < W; x++){
    if(!solid(x, y) || keep(px[y * W + x])) continue;
    const up = !solid(x, y - 1), dn = !solid(x, y + 1), lf = !solid(x - 1, y), rt = !solid(x + 1, y);
    if((up && lf && !dn && !rt) || (up && rt && !dn && !lf)) cut.push([x, y]);
  }
  cut.forEach(([x, y]) => { px[y * W + x] = null; });
  // 2. outline and light, read from the rounded shape
  const edge = [], out = px.map(p => p && p.slice());
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const p = px[y * W + x];
    if(!p || p[3] < 1 || keep(p)) continue;
    const open = !solid(x, y - 1) || !solid(x, y + 1) || !solid(x - 1, y) || !solid(x + 1, y);
    if(open){ out[y * W + x] = tdMix(p, TD_OUTLINE_RGB, o.outline === undefined ? 0.52 : o.outline); edge.push([x, y]); continue; }
    // one pixel in: lit near the top/left edge, shaded near the bottom/right edge
    const litTop = !solid(x, y - 2), litLeft = !solid(x - 2, y), shadeBottom = !solid(x, y + 2), shadeRight = !solid(x + 2, y);
    let q = p;
    if(litTop || litLeft) q = tdMix(q, TD_LIGHT_RGB, o.light === undefined ? 0.2 : o.light);
    if(shadeBottom || shadeRight) q = tdMix(q, TD_SHADE_RGB, o.shade === undefined ? 0.16 : o.shade);
    out[y * W + x] = q;
  }
  r.px = out;
  return r;
}

// --- the player -----------------------------------------------------------------
// The classic sprite through the finishing pass: the hair's corners rounded,
// edges outlined, eyes and the lantern glow kept clean, and a stepped pixel
// shadow in place of the flat rectangle. 16 x 22, feet where they were.
function tdPlayerSpriteV2(dir, frame){
  const C = TD_PLAYER_COLORS, r = tdRaster(tdPlayerSprite(dir, frame));
  const clean = [C.eye, C.eyeLight, C.lamp, C.blush, C.mouth].map(c => tdParseColor(c).slice(0, 3).join());
  for(let k = 0; k < r.px.length; k++) if(r.px[k] && r.px[k][3] < 1) r.px[k] = null; // the old shadow
  tdStylize(r, { keep: p => clean.includes(p.slice(0, 3).join()), roundRows: [0, 9], outline: 0.58, light: 0.22, shade: 0.14 });
  // hair sheen: in each column, the hair pixel just under the top outline catches the light
  for(let x = 0; x < r.w; x++){
    let y = 0; while(y < 6 && !r.px[y * r.w + x]) y++;
    const k = (y + 1) * r.w + x, p = r.px[k];
    if(y < 6 && p && p[2] - p[0] > 60) r.px[k] = tdMix(p, [154, 184, 239], 0.32);
  }
  // a stepped oval shadow under the feet (flat alpha steps, crisp edges)
  const shadow = [[20, 4, 11, 0.3], [21, 3, 12, 0.2], [21, 4, 11, 0.26]];
  shadow.forEach(([y, x0, x1, a]) => { for(let x = x0; x <= x1; x++){ const k = y * r.w + x; if(!r.px[k] || r.px[k][3] < 1) r.px[k] = [30, 26, 34, a]; } });
  return tdUnraster(r);
}

// --- the house ------------------------------------------------------------------
// Hand-painted for v2 at the classic size (84 x 73, ground row 70): the same
// door, walls and roof measures as the classic house (door frame 25 px, walls
// 66 px, ridge 64 px up), with its own materials — grained honey boards, round
// footing stones, scalloped shingles in light and shade, an arched door, glowing
// windows — then the finishing pass.
const TD_HOUSE_V2_GLOW = ['#fff0b8', '#f8dc8a', '#f3cf74', '#e8bd62', '#ffffff', '#ffd27a', '#fff3c4', '#f6d27c'];
function tdHouseSpriteV2(){
  const W = 84, H = 73, G = 70, px = new Array(W * H).fill(null);
  const hex = c => tdParseColor(c);
  const set = (x, y, c) => { if(x >= 0 && y >= 0 && x < W && y < H) px[y * W + x] = typeof c === 'string' ? hex(c) : c.slice(); };
  const rect = (x, y, w, h, c) => { for(let yy = y; yy < y + h; yy++) for(let xx = x; xx < x + w; xx++) set(xx, yy, c); };
  const hsh = (a, b, s) => tdHash(a, b, s);
  // walls: horizontal boards, each its own tone, a grain line and the odd knot
  const boards = ['#ecd5a4', '#e6cc96', '#efdbae', '#e2c68e'];
  for(let y = 36; y < G - 5; y++){
    const row = Math.floor((y - 36) / 4), seam = (y - 36) % 4 === 3;
    for(let x = 9; x < 75; x++){
      const plank = Math.floor((x + (row % 2) * 11) / 22), base = hex(boards[Math.floor(hsh(plank, row, 61) * boards.length)]);
      let c = base;
      if(seam) c = hex('#b8935f');
      else if((x + (row % 2) * 11) % 22 === 0) c = hex('#c9a46c'); // board ends
      else if((y - 36) % 4 === 1 && hsh(x, row, 63) < 0.28) c = tdMix(base, hex('#c09a62'), 0.55); // grain
      set(x, y, c);
    }
    if(!seam && hsh(row, 1, 65) < 0.5){ const kx = 14 + Math.floor(hsh(row, 2, 67) * 54); if(kx < 30 || kx > 54){ set(kx, y, '#a8834f'); } }
  }
  // stone footing: round stones with a lit top-left and a shaded bottom-right
  rect(9, G - 5, 66, 5, '#6c645b');
  for(let x = 9, i = 0; x < 75; i++){
    const sw = 5 + Math.floor(hsh(i, 3, 71) * 4), tone = hex(['#a49b90', '#9a9186', '#aea598'][i % 3]);
    for(let yy = G - 5; yy < G; yy++) for(let xx = x; xx < Math.min(75, x + sw - 1); xx++){
      const lx = xx - x, ly = yy - (G - 5), last = sw - 2;
      if((lx === 0 || lx === last) && (ly === 0 || ly === 4)) continue; // round corners
      set(xx, yy, ly === 0 || lx === 0 ? tdMix(tone, TD_LIGHT_RGB, 0.3) : ly === 4 || lx === last ? tdMix(tone, TD_SHADE_RGB, 0.25) : tone);
    }
    x += sw;
  }
  // timber frame: lit on the left, shaded on the right
  const post = (x, y, h) => { rect(x, y, 3, h, '#8a6440'); rect(x, y, 1, h, '#a87e52'); rect(x + 2, y, 1, h, '#6c4c30'); };
  post(9, 36, G - 41); post(72, 36, G - 41); post(31, 39, G - 44); post(50, 39, G - 44);
  rect(9, 37, 66, 2, '#8a6440'); rect(9, 37, 66, 1, '#a87e52'); rect(9, 39, 66, 1, '#5c4029');
  // the door: an arched frame, vertical planks with grain, iron straps and studs, a little window, the step
  for(let y = 43; y < G - 2; y++){
    const inset = y === 43 ? 3 : y === 44 ? 1 : 0;
    for(let x = 34 + inset; x < 50 - inset; x++) set(x, y, '#5a3b28');
  }
  for(let y = 45; y < G - 2; y++){
    const inset = y === 45 ? 2 : y === 46 ? 1 : 0;
    for(let x = 36 + inset; x < 48 - inset; x++){
      const plank = Math.floor((x - 36) / 4), lx = (x - 36) % 4;
      const base = hex(['#94603a', '#8a5a36', '#9a663e'][plank]);
      set(x, y, lx === 3 ? hex('#6e4528') : lx === 0 ? tdMix(base, TD_LIGHT_RGB, 0.18) : hsh(x, y, 73) < 0.12 ? tdMix(base, hex('#6e4528'), 0.5) : base);
    }
  }
  [50, 62].forEach(y => { rect(36, y, 12, 1, '#4b4440'); set(37, y, '#8d857c'); set(46, y, '#8d857c'); });
  rect(39, 48, 6, 4, '#3a2a1e'); rect(40, 49, 4, 2, '#f6d27c'); set(40, 49, '#fff0b8');
  rect(45, 56, 2, 2, '#e2b23c'); set(45, 56, '#f7da7a');
  for(let x = 31; x < 53; x++){ set(x, G - 2, x === 31 || x === 52 ? '#9a9086' : '#cfc6bc'); set(x, G - 1, x === 31 || x === 52 ? '#7c736a' : '#aaa198'); }
  // windows: rounded frames, warm glass lit from the top, mullions, flower boxes with leaves
  [[15, 45], [59, 45]].forEach(([x, y]) => {
    for(let yy = 0; yy < 11; yy++) for(let xx = 0; xx < 11; xx++){
      if((xx === 0 || xx === 10) && (yy === 0 || yy === 10)) continue;
      const frame = xx === 0 || xx === 10 || yy === 0 || yy === 10 || xx === 5 || yy === 5;
      set(x + xx, y + yy, frame ? '#5a3b28' : yy < 3 ? '#fff0b8' : yy < 5 ? '#f8dc8a' : yy < 8 ? '#f3cf74' : '#e8bd62');
    }
    set(x + 2, y + 2, '#ffffff');
    for(let xx = -1; xx < 12; xx++){ set(x + xx, y + 12, '#a07a50'); set(x + xx, y + 13, '#8a6440'); set(x + xx, y + 14, '#6c4c30'); }
    for(let xx = 0; xx < 11; xx++) set(x + xx, y + 11, (xx % 3 === 1) ? '#4f8246' : '#3f6b3a');
    [[0, '#e06f8a'], [3, '#f0d060'], [6, '#e06f8a'], [9, '#f7c0cf']].forEach(([dx, c]) => { set(x + dx, y + 10, c); set(x + dx + 1, y + 10, c); set(x + dx, y + 9, tdMix(hex(c), TD_LIGHT_RGB, 0.35)); set(x + dx + 1, y + 11, '#6aa35a'); });
  });
  // a lantern beside the door, with a stepped glow
  rect(54, 46, 6, 1, '#3a2a1e'); rect(55, 47, 4, 5, '#3a2a1e'); rect(56, 48, 2, 3, '#ffd27a'); set(56, 48, '#fff3c4');
  // shade under the eaves: two flat rows on the boards (pixels, no gradient)
  for(let x = 12; x < 72; x++){ const a = px[39 * W + x], b = px[40 * W + x]; if(a) px[39 * W + x] = tdMix(a, [80, 54, 30], 0.35); if(b) px[40 * W + x] = tdMix(b, [80, 54, 30], 0.15); }
  // roof: rows of scalloped shingles widening to the eaves. Each tab is one unit:
  // its tone comes from where it sits (light upper left, shade lower right) plus a
  // little jitter, its top row catches light and its rounded lower edge is darker.
  const shingle = [['#80b96c', '#6aa35a', '#5a9150'], ['#629a55', '#4f8246', '#447a40'], ['#4e8146', '#3f6b3a', '#365f33']];
  for(let y = 8; y <= 34; y++){
    const o = Math.round((y - 8) * 16 / 26), x0 = 20 - o, w = 44 + 2 * o, band = Math.floor((y - 8) / 3), ly = (y - 8) % 3, v = (y - 8) / 27;
    for(let x = x0; x < x0 + w; x++){
      if((x === x0 || x === x0 + w - 1) && ly === 2) continue; // round the slope's stepped edge
      const tab = Math.floor((x - 20 + 40 + (band % 2) * 3) / 6), lx = (x - 20 + 40 + (band % 2) * 3) % 6;
      const cx = (tab * 6 - 40 + 3 - (x0 - 20)) / w, lit = 1 - (cx * 0.62 + v * 0.48) + (hsh(tab, band, 75) - 0.5) * 0.3;
      const t = shingle[lit > 0.58 ? 0 : lit > 0.24 ? 1 : 2];
      let c = hex(t[1]);
      if(ly === 0) c = lx === 0 ? hex(t[1]) : hex(t[0]);
      if(ly === 2) c = lx === 0 || lx === 5 ? tdMix(hex(t[2]), [34, 60, 34], 0.35) : hex(t[2]);
      if(ly === 1 && lx === 5) c = tdMix(hex(t[1]), hex(t[2]), 0.5);
      set(x, y, c);
    }
  }
  for(let x = 21; x < 63; x++){ set(x, 7, '#86bd6c'); set(x, 6, x === 21 || x === 62 ? '#3f6b3a' : '#4f8246'); }
  for(let x = 4; x < 80; x++){ set(x, 35, x === 4 || x === 79 ? '#2c4d2a' : '#35592f'); set(x, 36, '#2c4a28'); }
  set(3, 35, '#2c4d2a'); set(80, 35, '#2c4d2a');
  // chimney: little bricks, a lit side and a cap
  for(let y = 4; y < 16; y++) for(let x = 58; x < 66; x++){
    const brick = (y % 3 === 0) || ((x + (Math.floor(y / 3) % 2) * 2) % 4 === 0);
    set(x, y, brick ? '#5f544b' : x < 60 ? '#958576' : x > 63 ? '#6e6157' : '#7f7064');
  }
  rect(57, 2, 10, 2, '#a59585'); rect(57, 3, 10, 1, '#7a6a5e');
  const r = tdStylize({ w: W, h: H, px }, {
    keep: p => TD_HOUSE_V2_GLOW.includes(tdColorKey(p)), // window glass and the lantern stay bright
    roundRows: [0, 40], outline: 0.45, light: 0.1, shade: 0.12,
  });
  // the ground contact shadow: flat alpha steps with stepped ends
  [[G, 6, 77, 0.32], [G + 1, 5, 78, 0.22], [G + 2, 8, 75, 0.12]].forEach(([y, x0, x1, a]) => {
    for(let x = x0; x <= x1; x++){ const k = y * W + x; if(!r.px[k]) r.px[k] = [30, 26, 34, a]; }
  });
  return tdUnraster(r);
}

// --- ground ----------------------------------------------------------------------
// v2 grass for one 16 x 16 tile: low-frequency patches of three tones, single-pixel
// blades with a lit tip and a dark root, small tufts and flowers. `put` as in tdPaintTileMap.
const TD_GRASS_V2 = {
  tones: [[78, 124, 69], [84, 132, 74], [90, 140, 79]], deep: [71, 115, 65],
  blade: [100, 152, 84], tip: [128, 178, 100], root: [66, 106, 61], flower: [[244, 214, 120], [232, 140, 166], [176, 204, 240], [250, 246, 232]],
};
function tdPaintGrassV2(put, x0, y0, i, j){
  const T = TOPDOWN.TILE, G = TD_GRASS_V2;
  for(let y = 0; y < T; y++) for(let x = 0; x < T; x++){
    const wx = x0 + x, wy = y0 + y;
    // patches: two offset 12 px grids blended, the borders dithered pixel by pixel so
    // the clumps have ragged natural edges (stepped tones, so it stays pixel art)
    const fine = tdHash(wx, wy, 85);
    const n = (tdHash(Math.floor(wx / 12), Math.floor(wy / 12), 81) + tdHash(Math.floor((wx + 6) / 12), Math.floor((wy + 6) / 12), 83)) / 2 + (fine - 0.5) * 0.22;
    let c = n < 0.36 ? G.tones[0] : n < 0.68 ? G.tones[1] : G.tones[2];
    if(fine < 0.03) c = G.deep; else if(fine > 0.985) c = G.tones[2];
    put(wx, wy, c);
  }
  // blades: a 1 px stroke, root dark, tip lit
  for(let k = 0; k < 4; k++){
    const bx = x0 + Math.floor(tdHash(i * 7 + k, j, 87) * T), by = y0 + 2 + Math.floor(tdHash(i, j * 7 + k, 89) * (T - 3));
    put(bx, by + 1, G.root); put(bx, by, G.blade); if(tdHash(bx, by, 91) < 0.6) put(bx, by - 1, G.tip);
  }
  // a tuft now and then: three blades fanning out, a shadow under them
  if(tdHash(i, j, 93) < 0.22){
    const tx = x0 + 3 + Math.floor(tdHash(i, j, 95) * 9), ty = y0 + 5 + Math.floor(tdHash(i, j, 97) * 8);
    put(tx - 1, ty + 1, G.root); put(tx, ty + 1, G.root); put(tx + 1, ty + 1, G.root);
    put(tx - 1, ty, G.blade); put(tx, ty, G.blade); put(tx + 1, ty, G.blade);
    put(tx - 1, ty - 1, G.tip); put(tx, ty - 2, G.tip); put(tx, ty - 1, G.blade); put(tx + 1, ty - 1, G.tip);
  }
  if(tdHash(i, j, 99) > 0.955){
    const fx = x0 + 4 + Math.floor(tdHash(i, j, 101) * 8), fy = y0 + 4 + Math.floor(tdHash(i, j, 103) * 8), fc = G.flower[Math.floor(tdHash(i, j, 105) * G.flower.length)];
    put(fx, fy - 1, fc); put(fx - 1, fy, fc); put(fx + 1, fy, fc); put(fx, fy + 1, fc); put(fx, fy, [250, 222, 110]); put(fx, fy + 2, G.root);
  }
}

// v2 cobbles: rounded stones in staggered rows, each lit top-left and shaded
// bottom-right, dark mortar with a little moss, sunk into the grass by a
// one-pixel shadow round the road. Returns the colour for road pixel (x, y),
// `d` its distance from the road's middle and `hw` the half width; or null.
const TD_ROAD_V2 = {
  stones: [[178, 166, 146], [168, 157, 138], [186, 174, 152], [162, 154, 140]], mortar: [112, 102, 90], moss: [104, 138, 82],
};
function tdRoadPixelV2(x, y, d, hw){
  const R = TD_ROAD_V2;
  if(d > hw - 1.5 && tdHash(x, y, 107) < 0.4) return null; // a ragged edge
  const row = Math.floor(y / 5), sx = x + (row % 2) * 3, col = Math.floor(sx / 7), lx = sx % 7, ly = y % 5;
  if(lx === 0 || ly === 0 || ((lx === 1 || lx === 6) && (ly === 1 || ly === 4))) return tdHash(x, y, 109) < 0.08 ? R.moss : R.mortar;
  const base = R.stones[Math.floor(tdHash(col, row, 111) * R.stones.length)];
  let c = base;
  if(ly === 1 || lx === 1) c = tdMix(base, TD_LIGHT_RGB, 0.32);
  else if(ly === 4 || lx === 6) c = tdMix(base, TD_SHADE_RGB, 0.22);
  if(d > hw - 2.5) c = tdMix(c, TD_SHADE_RGB, 0.15); // the edge stones sit lower
  return c;
}

// --- graphics pass 2, step 1: one finish for everything else ---------------------------
// With ?style=v2 the workshop, the craft huts, the village facilities, the veins, the trees
// and props, the workers and the torches go through the same finishing pass as the player
// and the house: rounded convex corners on their round parts, the warm plum inner outline,
// light from the top left and a cooler shade bottom right. Glowing pixels (windows, lamp
// glass, flames) are kept as they are. Same width and height, so every anchor, ground line
// and collision box stays exactly where it was. Pure: painter sprite in, painter sprite out.
const TD_FINISH = {
  // roundRows as fractions of the sprite height (the round parts: roofs, canopies, stone tops)
  building: { round: 0.55, outline: 0.45, light: 0.12, shade: 0.12 },
  vein: { round: 1, outline: 0.5, light: 0.14, shade: 0.12 },
  tree: { round: 0.75, outline: 0.45, light: 0.16, shade: 0.12 },
  prop: { round: 1, outline: 0.42, light: 0.12, shade: 0.12 },
  thin: { round: 0, outline: 0.3, light: 0.1, shade: 0.1 },     // lamp posts, boards, the torch: mostly edge pixels
  worker: { round: 0.22, outline: 0.32, light: 0.14, shade: 0.12 }, // the helmet's top rounds; tools stay light enough to read
};
// glowing pixels keep their colour: flames and the stove fire, the forge window, lit window
// glass, lamp glass and the helmet lamp (paper, skin, petals and gold trim are finished as usual)
// (a numeric key per colour: this runs for every pixel of every bake)
const TD_FINISH_GLOW = new Set(['#f07a30', '#f0a040', '#ffe08a', '#f0a050', '#f3d27a', '#f7e2a0', '#ffd27a', '#fff3b0'].map(c => { const p = tdParseColor(c); return (p[0] << 16) | (p[1] << 8) | p[2]; }));
function tdFinishKeeps(p){ return TD_FINISH_GLOW.has((p[0] << 16) | (p[1] << 8) | p[2]); }
function tdFinishSprite(sprite, kind){
  if(!sprite) return sprite;
  const o = TD_FINISH[kind] || TD_FINISH.prop, r = tdRaster(sprite);
  tdStylize(r, { keep: tdFinishKeeps, roundRows: [0, Math.round(sprite.h * o.round) - 1], outline: o.outline, light: o.light, shade: o.shade });
  return tdUnraster(r);
}
// What each prop is drawn as (the ground patches and the swaying tufts keep the classic look).
const TD_FINISH_PROP = { bigTree: 'tree', sparseTree: 'tree', lamp: 'thin', villageBoard: 'thin', timberSupport: 'thin', grass: null, clearing: null, diggingMarks: null };
function tdFinishPropKind(prop){ return prop in TD_FINISH_PROP ? TD_FINISH_PROP[prop] : 'prop'; }
