<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G3 집 외관 비교</title><style>body{font:16px/1.6 system-ui;background:#f2ead9;color:#40372f;margin:24px}button,select{font:inherit;padding:8px}img{max-width:100%;image-rendering:pixelated}section{margin:24px 0}a{color:#665333}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}figure{margin:0}figcaption{font-weight:bold}</style><h1>G3 집 외관 제안</h1><p>정식 적용 전 자료 · 84×73 유지 · 기본 classic/실내/충돌/저장 불변</p><p><a href="README.md">설명</a> · <a href="G3_REPORT.md">평가 보고서</a></p><label>기기 <select id="device"><option value="pc">PC 1280×800</option><option value="mobile">모바일 390×844 DPR3</option></select></label> <label>스타일 <select id="style"><option>v2</option><option>classic</option></select></label> <label>빛 <select id="light"><option value="">낮 0.10</option><option value="dusk-">저녁 0.34</option></select></label><section class="grid" id="shots"></section><h2>G1 캐릭터 비율</h2><img id="ratio" alt="기존/A/B/C와 G1 캐릭터"><h2>G2 공방과 정합</h2><img id="g2" alt="각 집과 G2 공방"><h2>원본과 6배 확대</h2><section class="grid" id="raw"></section><script>const ids=['device','style','light'];function render(){const d=device.value,s=style.value,l=light.value;shots.innerHTML=['existing','A','B','C'].map(a=>`<figure><figcaption>${a}</figcaption><a href="screenshots/${l}${d}-${s}-${a}.png"><img src="screenshots/${l}${d}-${s}-${a}.png" alt="${a} 실제 게임"></a></figure>`).join('');ratio.src=`screenshots/ratio-${s}.png`;g2.src=`screenshots/alongside-g2-${s}.png`;raw.innerHTML=['existing','A','B','C'].map(a=>`<figure><figcaption>${a} · <a href="screenshots/sprite-${s}-${a}-84x73.png">84×73 원본</a></figcaption><img src="screenshots/sprite-${s}-${a}-6x.png" alt="${a} 최근접 6배"></figure>`).join('')}ids.forEach(i=>document.getElementById(i).onchange=render);render()</script></html>
